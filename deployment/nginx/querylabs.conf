# Query Labs — nginx reverse proxy (HTTP; certbot will add TLS)
# Default public host for this VM (IP-based DNS via sslip.io).
# Replace server_name if you have a real domain.

upstream querylab_frontend {
    server 127.0.0.1:5174;
}

upstream querylab_api {
    server 127.0.0.1:8084;
}

server {
    listen 80;
    listen [::]:80;
    server_name 3.109.189.178.sslip.io;

    client_max_body_size 25m;

    # Orchestrator API (+ SSE streams)
    location /api/ {
        proxy_pass http://querylab_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Agents health/docs (optional; keep behind auth in production if exposed)
    location /agents-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
        proxy_pass http://querylab_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
