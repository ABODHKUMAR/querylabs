[tool.poetry]
name = "querylab_agents"
version = "0.1.0"
description = ""
authors = ["Harjot Singh"]
readme = "README.md"
packages = [{ include = "querylab_agent" }]  # 👈 Add this if your code is inside `querylab_agent/`

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "^2.0"
pyyaml = "^6.0"
a2a-sdk = "^0.3.25"
langchain = "^1.2.12"
langchain-community = "^0.4.1"
langchain-openai = "^1.1.11"
langgraph = "^1.1.1"
langgraph-supervisor = "^0.0.31"
fastapi = "^0.135.1"
langchain-mcp-adapters = { version = "^0.1", optional = true }
uvicorn = "^0.42.0"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^9.0.2"


[tool.poetry.group.gcp.dependencies]
google-cloud-secret-manager = "^2.23.3"
google-cloud-storage = "^3.1.0"

[tool.poetry.extras]
mcp = ["langchain-mcp-adapters"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
