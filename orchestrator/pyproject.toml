[tool.poetry]
name = "querylab-orchestrator"
version = "0.1.0"
description = "Orchestrator service: streaming query + data_sources (agent card names) from agents API"
readme = "README.md"
packages = [{ include = "orchestrator" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
httpx = "^0.28.0"
pydantic = "^2.0"
langchain = "^1.1.0"
langchain-openai = "^1.1.0"
langgraph = ">=0.2.0"
python-dotenv = "^1.0.0"
pyjwt = "^2.12.1"
bcrypt = "^5.0.0"
pymysql = "^1.1.2"
aiomysql = "^0.3.2"
sqlalchemy = "^2.0.48"
slowapi = "^0.1.9"
pydantic-settings = "^2.13.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "aiosqlite (>=0.22.1,<0.23.0)"
]
